# Fictional newsroom settings. Credentials belong only in GitHub Actions repository secrets.
# A military, defense and veterans beat.
[identity]
id = "example-defense"
newsletter_name = "Military Document Hunt"
sender_name = "Example Newsroom"
accent_color = "#173f67"

[beat]
name = "Military, defense and veterans"
brief = """Find official military, defense and veterans document trails that could support original
reporting for reporters covering troops, veterans, families, readiness, accountability, safety,
spending and military justice."""
priorities = [
  "Oversight and money: inspector general, GAO and CRS findings, misconduct, safety, readiness gaps, procurement, contracts, grants, failed programs, civilian harm, fraud, waste and abuse, congressional oversight",
  "Personnel and veterans: troops, families, recruiting, justice, extremism, health, quality of life, pay, housing, childcare, education, retention, VA benefits and health care, toxic exposure, claims and data systems",
  "Operations and policy only when they create a strong document trail",
]
source_families = [
  "Federal Register notices, Privacy Act systems of records notices, rulemakings, information collections and advisory committee notices",
  "Regulations.gov dockets and attachments; RegInfo/OIRA information collection packages and supporting statements",
  "GAO, CRS, DoD Inspector General, VA Office of Inspector General, service inspectors general",
  "House and Senate Armed Services and Veterans' Affairs committees, appropriations and oversight committees: hearings, witness statements, transcripts, QFRs, markups, reports",
  "SAM.gov, USAspending and contract announcements: awards, solicitations, justification and approval notices, statements of work",
  "DoD, service branch, VA, DHA/TRICARE, DCMA, DLA and DFAS reading rooms, FOIA logs, datasets, forms and reports",
]
geography = "United States"
exclusions = "Opinion, speculation, routine ceremonies, and social media chatter that does not point to an official record."
records_law = "the federal Freedom of Information Act (FOIA)"
freshness_days = 3
max_leads = 3

[agent]
runtime = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"
timeout_minutes = 18

[email]
provider = "resend"
sender = "briefing@example.org"
recipients = ["reporter@example.org"]

[schedule]
enabled = false
timezone = "America/Los_Angeles"
weekdays = [0, 1, 2, 3, 4]
preferred_time = "06:00"
