name: Document Hunt
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: preview is fictional/offline; paid-ai-preview runs the billed agent without sending; scheduled is for an external timer
        type: choice
        default: preview
        options: [preview, paid-ai-preview, send-preview-test, deliver, resend, scheduled]
      preview_run_id:
        description: Previous successful paid-ai-preview run ID (test or resend)
        type: string
      recipient:
        description: One configured recipient for send-preview-test (blank = the first in email.recipients)
        type: string
      attempt_id:
        description: Unique attempt ID; required for resend (blank for a test = one derived from this run)
        type: string
permissions:
  contents: read
concurrency:
  group: document-hunt-state
  cancel-in-progress: false
jobs:
  hunt:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Application deadline
        run: echo "DOCHUNT_DEADLINE=$(( $(date +%s) + 1500 ))" >> "$GITHUB_ENV"
      # No Git credential is stored in the checkout: the research agent runs in this job,
      # and only the delivery steps below receive a push token, through their own environment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Eligibility before dependency installation
        id: due
        env:
          PYTHONPATH: src
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = deliver ]; then
            python -m dochunt.cli due-check --manual
          elif [ -z "$MODE" ] || [ "$MODE" = scheduled ]; then
            # An external timer dispatching mode=scheduled gets exactly the schedule's checks.
            python -m dochunt.cli due-check
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.due.outputs.due == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'scheduled')
        run: python -m pip install .
      - name: Select agent
        id: agent
        if: steps.due.outputs.due == 'true' || github.event.inputs.mode == 'paid-ai-preview'
        run: |
          runtime=$(python -c "import tomllib; print(tomllib.load(open('newsroom.toml','rb'))['agent']['runtime'])")
          case "$runtime" in
            codex) echo "package=@openai/codex@0.163.0" >> "$GITHUB_OUTPUT" ;;
            claude) echo "package=@anthropic-ai/claude-code@2.1.299" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::agent.runtime must be codex or claude"; exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.agent.outputs.package != ''
        with:
          node-version: '22'
      - name: Install agent CLI
        if: steps.agent.outputs.package != ''
        env:
          PACKAGE: ${{ steps.agent.outputs.package }}
        run: npm install --global "$PACKAGE"
      - name: Synthetic preview
        if: github.event.inputs.mode == 'preview'
        run: dochunt preview --synthetic --output-dir output
      - name: Paid AI preview (research only, no email)
        if: github.event.inputs.mode == 'paid-ai-preview'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          remaining=$(( DOCHUNT_DEADLINE - $(date +%s) ))
          [ "$remaining" -gt 0 ] || exit 1
          timeout "$remaining" dochunt preview --paid --output-dir output
      - name: Show the preview on the run page
        if: success() && (github.event.inputs.mode == 'preview' || github.event.inputs.mode == 'paid-ai-preview')
        run: dochunt summary --output-dir output --run-id "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Select previous trusted preview
        if: github.event.inputs.mode == 'send-preview-test' || github.event.inputs.mode == 'resend'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ github.event.inputs.preview_run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remaining=$(( DOCHUNT_DEADLINE - $(date +%s) ))
          [ "$remaining" -gt 0 ] || exit 1
          timeout "$remaining" dochunt download-preview --run-id "$PREVIEW_RUN_ID" --repository "$REPOSITORY" --branch "$BRANCH" --output-dir selected-preview
      - name: Configure local commit identity
        if: steps.due.outputs.due == 'true' || github.event.inputs.mode == 'send-preview-test' || github.event.inputs.mode == 'resend'
        run: |
          git config user.name 'DocHunt state'
          git config user.email 'dochunt@users.noreply.github.com'
      - name: Mint state publication token
        id: bot-token
        if: vars.BOT_APP_CLIENT_ID != '' && (steps.due.outputs.due == 'true' || github.event.inputs.mode == 'send-preview-test' || github.event.inputs.mode == 'resend')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Delivery credential readiness before paid research
        if: steps.due.outputs.due == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUBSCRIPTION_API_TOKEN: ${{ secrets.SUBSCRIPTION_API_TOKEN }}
        run: dochunt delivery-readiness
      - name: Research
        if: steps.due.outputs.due == 'true' && github.event.inputs.mode != 'preview'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remaining=$(( DOCHUNT_DEADLINE - $(date +%s) ))
          [ "$remaining" -gt 0 ] || exit 1
          if [ "$MODE" = deliver ]; then
            timeout "$remaining" dochunt run --research-only --manual --branch "$BRANCH"
          else
            timeout "$remaining" dochunt run --research-only --branch "$BRANCH"
          fi
      - name: Deliver with synchronous state publication
        if: steps.due.outputs.due == 'true' && github.event.inputs.mode != 'preview'
        env:
          # State publication pushes with the optional bot App token when configured (a branch-ruleset
          # bypass actor), otherwise with this job's GITHUB_TOKEN. Only delivery steps receive it.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.bot-token.outputs.token || github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUBSCRIPTION_API_TOKEN: ${{ secrets.SUBSCRIPTION_API_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remaining=$(( DOCHUNT_DEADLINE - $(date +%s) ))
          [ "$remaining" -gt 0 ] || exit 1
          if [ "$MODE" = deliver ]; then
            timeout "$remaining" dochunt run --delivery-only --manual --branch "$BRANCH"
          else
            timeout "$remaining" dochunt run --delivery-only --branch "$BRANCH"
          fi
      - name: Explicit selected-preview test or resend
        if: github.event.inputs.mode == 'send-preview-test' || github.event.inputs.mode == 'resend'
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.bot-token.outputs.token || github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUBSCRIPTION_API_TOKEN: ${{ secrets.SUBSCRIPTION_API_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
          RECIPIENT: ${{ github.event.inputs.recipient }}
          ATTEMPT_ID: ${{ github.event.inputs.attempt_id }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remaining=$(( DOCHUNT_DEADLINE - $(date +%s) ))
          [ "$remaining" -gt 0 ] || exit 1
          if [ "$MODE" = send-preview-test ]; then
            # Blank fields get defaults. Re-running this same run reuses its attempt ID, so it cannot send twice.
            test_args=(--attempt-id "${ATTEMPT_ID:-test-$GITHUB_RUN_ID}")
            if [ -n "$RECIPIENT" ]; then test_args+=(--recipient "$RECIPIENT"); fi
            timeout "$remaining" dochunt preview-test --issue-dir selected-preview "${test_args[@]}" --branch "$BRANCH"
          else
            timeout "$remaining" dochunt resend --issue-dir selected-preview --attempt-id "$ATTEMPT_ID" --branch "$BRANCH"
          fi
      - name: Reviewed paid preview artifact
        if: success() && github.event.inputs.mode == 'paid-ai-preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paid-ai-preview-${{ github.run_id }}
          path: |
            output/issue.json
            output/check-report.json
            output/preview.html
            output/preview.txt
            output/preview-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Private installation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: document-hunt-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
