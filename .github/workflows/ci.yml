name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: |
          dochunt validate-config --config examples/education.toml
          dochunt validate-config --config examples/military.toml
          dochunt validate-config --config examples/labor.toml
          dochunt validate-config --config newsroom.toml
          python -m compileall -q src
          python -m pip wheel --no-deps . --wheel-dir /tmp/dochunt-wheels
          git diff --check
