name: CI
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Pinned agent CLIs, so the argument-parsing smoke test runs against what the hunt installs.
      - run: npm install --global @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.299
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: node timer/test.mjs
      - run: |
          for f in newsroom.toml examples/*.toml; do dochunt validate-config --config "$f"; done
          dochunt preview --synthetic --output-dir /tmp/dochunt-preview
          dochunt preview --synthetic --fixture no-leads --output-dir /tmp/dochunt-preview-empty
          python -m compileall -q src
          python -m pip wheel --no-deps . --wheel-dir /tmp/dochunt-wheels
          git diff --check
