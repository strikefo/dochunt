# Frozen DocHunt evaluation cases. Frozen 2026-10-06 before any engine output exists.
# Do not edit briefs, geography or source lists after outputs are seen; add a new
# versioned case instead and say why.
#
# track = "supplied"  : the engine receives only the listed saved receipts (no fetching).
# track = "discovery" : brief + geography (+ optional playbook) only; needs approved live retrieval.
# exposure = "regression" : used as an evaluation/development case before this assessment.
# exposure = "unused"     : never used as an evaluation case; the receipts did appear in earlier
#                           fixtures, discovery runs or tests, so prior agents (and this assessor)
#                           have seen them. Not a blind held-out set.
# exposure = "held_out"   : no sources chosen; nobody has seen outputs for this brief.
# exercises = structural features present in the sources, recorded so coverage of the
#             required situations can be checked. They are NOT expected answers.

